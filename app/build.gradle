plugins {
    id 'com.android.application'
}

android {
    namespace 'com.techno.installer'
    compileSdk 34

    defaultConfig {
        applicationId "com.techno.installer"
        // REQUEST_INSTALL_PACKAGES and the PackageInstaller Session pending-user-action
        // callback flow both need API 26 (Android 8.0) to behave correctly.
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
